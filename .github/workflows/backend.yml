name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: horecaso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      # DATABASE_URL/TEST_DATABASE_URL, ALLOWED_ORIGINS y ENVIRONMENT coinciden
      # con los defaults de `tests/conftest.py` a propósito. SECRET_KEY_AUTH NO
      # se fija aquí: `conftest.py` usa `os.environ.setdefault(...)` con el
      # mismo valor que `tests/test_auth.py` espera al decodificar el JWT; si
      # lo fijáramos aquí lo pisaríamos y ese test fallaría.
      DATABASE_URL: postgresql://postgres:test@localhost:5432/horecaso_test
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/horecaso_test
      ALLOWED_ORIGINS: http://localhost:5173
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Smoke check — la app importa sin errores
        env:
          SECRET_KEY_AUTH: test_secret_key_for_pytest_only
        run: python -c "from main import create_app; create_app()"

      - name: Run pytest
        # `python -m pytest` (no el script `pytest` a secas) para que el
        # directorio actual (`backend/`) se añada a sys.path igual que en
        # local; si no, `tests/conftest.py` falla con
        # `ModuleNotFoundError: No module named 'database'`.
        run: python -m pytest -v
