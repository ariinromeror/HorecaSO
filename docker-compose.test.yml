# BD de PRUEBA para pytest (nunca producción). Datos en memoria: se pierden al parar.
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgresql://postgres@localhost:54329/horecaso_test
services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: horecaso_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "horecaso_test"]
      interval: 2s
      timeout: 2s
      retries: 15
